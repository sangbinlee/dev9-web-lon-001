name: CI/CD to Kubernetes

on:
  push:
    branches:
      - main

permissions:
  packages: write
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout web project
      uses: actions/checkout@v3
      with:
        fetch-depth: 0

    - name: Checkout parent project
      uses: actions/checkout@v3
      with:
        repository: sangbinlee/dev9-parent
        path: dev9-parent

    - name: Checkout core project
      uses: actions/checkout@v3
      with:
        repository: sangbinlee/dev9-core
        path: dev9-core

    - name: Set up JDK 21
      uses: actions/setup-java@v3
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: 'maven'

    - name: Build parent modules
      run: mvn clean install -DskipTests
      working-directory: ./dev9-parent

    - name: Build core module
      run: mvn clean install -DskipTests
      working-directory: ./dev9-core

    - name: Build web module
      run: mvn clean package -DskipTests
      working-directory: .

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v2
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and Push Docker Image
      run: |
        IMAGE=ghcr.io/${{ github.repository_owner }}/dev9-web-lon-001:latest
        docker build -t $IMAGE .
        docker push $IMAGE

    - name: Set up kubectl
      uses: azure/setup-kubectl@v3
      with:
        version: 'latest'

    - name: Configure K8s credentials
      run: echo "${{ secrets.KUBE_CONFIG }}" > kubeconfig.yaml
      env:
        KUBECONFIG: kubeconfig.yaml

    - name: Deploy to Kubernetes
      run: |
        kubectl apply -f deployment.yaml
        kubectl rollout status deployment/wildfly-app
      working-directory: .
      env:
        KUBECONFIG: kubeconfig.yaml
