apiVersion: apps/v1
kind: Deployment
metadata:
  name: wildfly-app
  labels:
    app: wildfly-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: wildfly-app
  template:
    metadata:
      labels:
        app: wildfly-app
    spec:
      containers:
        - name: wildfly-app
          image: ghcr.io/sangbinlee/dev9-web-lon-001:latest
          ports:
            - containerPort: 8080
            - containerPort: 9404
          env:
            - name: JAVA_OPTS
              value: "-Djava.util.logging.manager=org.jboss.logmanager.LogManager"
            - name: DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: db-config
                  key: host
            - name: DB_PORT
              valueFrom:
                configMapKeyRef:
                  name: db-config
                  key: port
            - name: DB_NAME
              valueFrom:
                configMapKeyRef:
                  name: db-config
                  key: database
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: db-secret
                  key: username
            - name: DB_PASS
              valueFrom:
                secretKeyRef:
                  name: db-secret
                  key: password
---
apiVersion: v1
kind: Service
metadata:
  name: wildfly-service
  labels:
    app: wildfly-app
spec:
  selector:
    app: wildfly-app
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080
      name: http
    - protocol: TCP
      port: 9404
      targetPort: 9404
      name: metrics
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: wildfly-ingress
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - diary.dev9.shop
    secretName: wildfly-tls
  rules:
  - host: diary.dev9.shop
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: wildfly-service
            port:
              number: 80
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: wildfly-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: wildfly-app
  minReplicas: 2
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70