# 1. Secret (민감한 값: username, password)
apiVersion: v1
kind: Secret
metadata:
  name: my-db-secret
type: Opaque
stringData:
  username: wpuser
  password: wppass
---
# 2. ConfigMap (일반 설정: host, port, database)
apiVersion: v1
kind: ConfigMap
metadata:
  name: my-db-config
data:
  MYSQL_HOST: mysql-service
  MYSQL_PORT: "3306"
  MYSQL_DATABASE: wpdb
---
# 3. WildFly Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wildfly-app
  labels:
    app: wildfly-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: wildfly-app
  template:
    metadata:
      labels:
        app: wildfly-app
    spec:
      containers:
      - name: wildfly-app
        image: ghcr.io/sangbinlee/dev9-web-lon-001:2f36b8403ce9ee5efd6e0c6bd98c357d7e1026fb
        ports:
        - containerPort: 8080
        - containerPort: 9404
        env:
        - name: JAVA_OPTS
          value: "-Djava.util.logging.manager=org.jboss.logmanager.LogManager"
        - name: MYSQL_USER
          valueFrom:
            secretKeyRef:
              name: my-db-secret
              key: username
        - name: MYSQL_PASSWORD
          valueFrom:
            secretKeyRef:
              name: my-db-secret
              key: password
        - name: MYSQL_HOST
          valueFrom:
            configMapKeyRef:
              name: my-db-config
              key: MYSQL_HOST
        - name: MYSQL_PORT
          valueFrom:
            configMapKeyRef:
              name: my-db-config
              key: MYSQL_PORT
        - name: MYSQL_DATABASE
          valueFrom:
            configMapKeyRef:
              name: my-db-config
              key: MYSQL_DATABASE
---
# 4. Service
apiVersion: v1
kind: Service
metadata:
  name: wildfly-service
  labels:
    app: wildfly-app
spec:
  selector:
    app: wildfly-app
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080
      name: http
    - protocol: TCP
      port: 9404
      targetPort: 9404
      name: metrics
  type: ClusterIP
---
# 5. Ingress
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: wildfly-ingress
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - diary.dev9.shop
    secretName: wildfly-tls
  rules:
  - host: diary.dev9.shop
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: wildfly-service
            port:
              number: 80
---
# 6. HorizontalPodAutoscaler
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: wildfly-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: wildfly-app
  minReplicas: 2
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70